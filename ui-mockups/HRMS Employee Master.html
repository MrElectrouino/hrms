 let sw=$("viewsw");if(!sw){sw=document.createElement("div");sw.id="viewsw";sw.className="pack";document.querySelector(".topbar").insertBefore(sw,document.querySelector(".topbar .pack"));}
 sw.innerHTML=`<button data-view="emp" aria-pressed="${!adm}">Organization view</button><button data-view="admin" aria-pressed="${adm}">System Admin</button>`;
 if(adm)renderAdmin();};
// Employee screens now read the editable pack
VIEWS.statutory=()=>note("Generated from the "+P().name+" Country Pack. System Admins change these fields in the admin console.")+grid(P().stat.map(x=>f(x[0],x[1],{req:x[2]===true})));
VIEWS.leave=()=>{const l=P().leaves;return grid([f("Leave Policy",P().name+" Standard 2026",{ro:1}),f("Leave Calendar",P().loc.fy),f("Accrual Type","Monthly"),f("Effective From","2026-01-01"),f("Effective To","2026-12-31"),f("Leave Encashment Eligible","Yes",{sel:["Yes","No"]})])+`<h2>Balances (from policy)</h2><div class="tw"><table><thead><tr><th>Leave type</th><th class="n">Entitled</th><th class="n">Taken</th><th class="n">Balance</th></tr></thead><tbody>${l.map((x,i)=>{const t=Math.min(+x[1]||0,i*2+1);return `<tr><td>${esc(x[0])}</td><td class="n">${x[1]}</td><td class="n">${t}</td><td class="n">${(+x[1]||0)-t}</td></tr>`}).join("")}</tbody></table></div><h2>Public holidays</h2><div class="tw"><table><thead><tr><th>Date</th><th>Holiday</th></tr></thead><tbody>${P().holidays.map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td></tr>`).join("")}</tbody></table></div>`};
const bump=()=>{const p=P();p.ver++;const v=$("verlbl");if(v)v.textContent=cc+"-2026."+p.ver};
document.addEventListener("input",ev=>{const t=ev.target;if(view!=="admin")return;
 const box=t.closest("[data-arr]");
 if(box&&t.dataset.i!==undefined){const arr=P()[box.dataset.arr],i=+t.dataset.i,c=t.dataset.c;const v=t.type==="checkbox"?t.checked:(t.type==="number"?(+t.value||0):t.value);
  if(c==="")arr[i]=v;else arr[i][+c]=v;bump();}
 else if(t.dataset.f){const p=P(),k=t.dataset.f.split(".");if(k.length===2)p[k[0]][k[1]]=t.value;else p[k[0]]=t.value;bump();}
});
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.view){view=b.dataset.view;render();return}
 if(view!=="admin")return;
 if(b.dataset.atab){atab=b.dataset.atab;render()}
 else if(b.dataset.aadd){const a=b.dataset.aadd,p=P();p[a].push(Array.isArray(BLANK[a])?BLANK[a].slice():BLANK[a]);if(a==="address")p.addr.push("");bump();render()}
 else if(b.dataset.adel){const a=b.dataset.adel,p=P(),i=+b.dataset.i;p[a].splice(i,1);if(a==="address")p.addr.splice(i,1);bump();render()}
 else if("apub" in b.dataset){toast("Published "+cc+"-2026."+P().ver+" · applies to all "+P().name+" employees")}
 else if("anew" in b.dataset){const n=$("newc").value.trim();if(!n){toast("Enter a country name first");return}
  let code=n.slice(0,2).toUpperCase(),x=1;while(PACKS[code])code=n.slice(0,1).toUpperCase()+(x++);
  PACKS[code]={name:n,flag:code,cur:"",entity:n+" Ltd · Head office",address:["State / Province","City","Street","Postal Code"],addr:["","","",""],bank:[["Bank Name",""],["Account Holder",""],["Account Number",""]],stat:[],docs:[["Passport","","","bad"]],sal:[["Basic Salary",0]],leaves:[["Annual Leave",20]],holidays:[],loc:{dateFmt:"DD/MM/YYYY",weekend:"Sat, Sun",fy:"Jan – Dec"},ver:1,emp:Object.assign({},PACKS.US.emp,{code:code+"-00001",name:"Sample Employee",addrCountry:n})};
  cc=code;atab="overview";render();toast(n+" created. Complete the setup steps below.")}
});
render();
</script>
